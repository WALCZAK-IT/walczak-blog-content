name: Generate summary.json

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Regenerate summary.json
        run: python scripts/generate_summary.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- summary.json; then
            echo "summary.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add summary.json
          git commit -m "chore: regenerate summary.json [skip ci]"
          git push
